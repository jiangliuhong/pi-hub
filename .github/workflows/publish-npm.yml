name: Publish to npm

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run complete test suite
        run: npm test

  publish:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm
        run: npm install --global npm@latest

      - name: Check package version on npm
        id: version
        shell: bash
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          current="$(node -p "require('./package.json').version")"

          published=false
          if npm view "${package_name}@${current}" version --json >/dev/null 2>&1; then
            published=true
          fi

          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "package: ${package_name}@${current}, published on npm: ${published}"

      - name: Skip already published version
        if: steps.version.outputs.published == 'true'
        run: echo "${{ steps.version.outputs.package_name }}@${{ steps.version.outputs.current }} already exists on npm; skipping publish."

      - name: Install dependencies
        if: steps.version.outputs.published != 'true'
        run: npm ci

      - name: Run tests
        if: steps.version.outputs.published != 'true'
        run: npm test

      - name: Build package
        if: steps.version.outputs.published != 'true'
        run: npm run build

      - name: Publish package
        if: steps.version.outputs.published != 'true'
        run: npm publish --access public
